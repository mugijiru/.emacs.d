name: Update package

on:
  workflow_call:
    inputs:
      package:
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  update-package:
    runs-on: ubuntu-latest
    env:
      PACKAGE: ${{ inputs.package }}

    steps:
    - uses: purcell/setup-emacs@master
      with:
        version: 30.2

    - uses: actions/checkout@v7

    - name: Ignore compiled files
      run: |
        echo "*.elc" >> ~/.gitignore
    - name: Update package
      run: |
        emacs -Q --batch --eval "(setq user-emacs-directory \"$(pwd)/\")" \
          --eval '(setq el-get-git-install-url "https://github.com/mugijiru/el-get.git")' \
          --eval '(setq el-get-install-branch "fix-install-for-emacs29")' \
          --eval '(setq el-get-verbose t)' \
          --eval '(setq byte-compiler-warnings nil)' \
          -l ./init-el-get.el \
          --eval "(my/el-get-auto-update \"$PACKAGE\")"

    - if: failure() && env.PACKAGE == 'vterm'
      name: Diagnose vterm module build
      run: |
        set -u

        vterm_dir="$GITHUB_WORKSPACE/el-get/vterm"
        emacs_path=$(command -v emacs || true)
        module_suffix=$(emacs -Q --batch --eval '(princ module-file-suffix)' || true)
        echo "vterm directory: ${vterm_dir}"
        echo "Emacs executable: ${emacs_path}"
        emacs --version | sed -n '1p' || true
        echo "Emacs module suffix: ${module_suffix}"

        if [ ! -d "$vterm_dir" ]; then
          echo 'vterm source directory is unavailable after the failed update.'
          exit 0
        fi

        echo 'vterm module artifacts:'
        find "$vterm_dir" -type f -name 'vterm-module*' -print || true

        module_path=$(find "$vterm_dir" -type f -name "vterm-module${module_suffix}" -print -quit)
        if [ -n "$module_path" ]; then
          echo "module path: ${module_path}"
          file "$module_path" || true
          ldd "$module_path" || true
          readelf -d "$module_path" || true
        else
          echo 'vterm-module shared object was not found.'
        fi

        echo 'CMake files:'
        cmake_cache_count=0
        while IFS= read -r cmake_cache; do
          cmake_cache_count=$((cmake_cache_count + 1))
          echo "CMake cache: ${cmake_cache}"
          grep -nE 'CMAKE_(C_COMPILER|CXX_COMPILER|BUILD_TYPE)|LIBVTERM|USE_SYSTEM_LIBVTERM|CMAKE_(RUNTIME|LIBRARY|ARCHIVE)_OUTPUT_DIRECTORY' "$cmake_cache" || true
        done < <(find "$vterm_dir" -type f -name 'CMakeCache.txt' -print)
        if [ "$cmake_cache_count" -eq 0 ]; then
          echo 'CMakeCache.txt was not found.'
        fi

        echo 'Build metadata:'
        find "$vterm_dir" -type f \( -name 'build.ninja' -o -name 'Makefile' -o -name '*.log' \) -print | while IFS= read -r build_file; do
          echo "Build file: ${build_file}"
          grep -nE 'vterm-module|libvterm|CMAKE_|OUTPUT' "$build_file" | head -80 || true
        done

        echo 'Loading vterm-module directly:'
        emacs -Q --batch -L "$vterm_dir" \
          --eval '(princ (format "locate-library: %S\n" (locate-library "vterm-module")))' \
          --eval "(require 'vterm-module)" || true

    - if: failure() && env.PACKAGE == 'swiper'
      name: Diagnose swiper build
      run: |
        set -u

        swiper_dir="$GITHUB_WORKSPACE/el-get/swiper"
        avy_dir="$GITHUB_WORKSPACE/el-get/avy"
        hydra_dir="$GITHUB_WORKSPACE/el-get/hydra"

        echo "Emacs: $(emacs --version | sed -n '1p')"
        echo "el-get directory: $GITHUB_WORKSPACE/el-get"
        echo "swiper directory: $swiper_dir"
        echo "avy directory: $avy_dir"
        echo "hydra directory: $hydra_dir"
        echo "dependency files:"
        find "$avy_dir" "$hydra_dir" -maxdepth 2 -type f \
          \( -name 'avy.el' -o -name 'hydra-examples.el' \) -print 2>/dev/null || true

        echo 'Stored swiper recipe:'
        grep -n -A14 -B2 '^(swiper status' "$GITHUB_WORKSPACE/el-get/.status.el" || true
        echo 'Effective swiper recipe source:'
        grep -n -A24 -B2 '(:name swiper' "$GITHUB_WORKSPACE/recipes/swiper.rcp" || true
        echo 'Makefile compile commands:'
        make -C "$swiper_dir" -B -n \
          EMACS="emacs -Q -batch -L $avy_dir -L $hydra_dir" compile || true

    - name: Detect el-get.lock diff
      run: |
        git diff --exit-code --quiet el-get.lock || git add el-get.lock && echo 'found_update=1' >> $GITHUB_ENV

    - if: env.found_update == 1
      name: Get timestamp
      run: |
        echo "UPDATE_TIMESTAMP=$(date +%Y-%m-%d-%H%M%S)" >> $GITHUB_ENV

    - if: env.found_update == 1
      id: get-pr-body
      name: Set commit message
      run: |
        body=$(cat /tmp/commit-message.txt)
        body="${body//'%'/'%25'}"
        body="${body//$'\n'/' '}"
        body="${body//$'\r'/' '}"
        echo "body=${body}" >> $GITHUB_OUTPUT

    - if: env.found_update == 1
      id: remove-old-branches
      name: Remove old branches
      run: |
        git fetch --prune

        branches=($(git branch -r --format='%(refname:short)' | sed 's|^origin/||' | grep "^update-${PACKAGE}" || true))
        for branch in "${branches[@]}"; do
          echo "Remove remote branch: ${branch}"
          if git push origin --delete "${branch}"; then
            continue
          fi

          # Another package-update job may have deleted the branch first.
          # Continue only when the branch is verifiably gone; preserve real
          # deletion failures.
          if remote_ref=$(git ls-remote --heads origin "refs/heads/${branch}"); then
            if [ -z "${remote_ref}" ]; then
              echo "Remote branch already deleted: ${branch}"
              continue
            fi
          fi

          echo "Failed to remove remote branch: ${branch}" >&2
          exit 1
        done

    - if: env.found_update == 1
      name: Create PR
      uses: peter-evans/create-pull-request@v8
      env:
        BRANCH_NAME: update-${{ env.PACKAGE }}-${{ env.UPDATE_TIMESTAMP }}
        PR_TITLE: Update ${{ env.PACKAGE }}
      with:
        branch: ${{ env.BRANCH_NAME }}
        commit-message: ${{ steps.get-pr-body.outputs.body }}
        title: ${{ env.PR_TITLE }}
        body: ${{ steps.get-pr-body.outputs.body }}
        labels: |
          dependencies

    - if: always()
      name: Notify slack build result
      uses: lazy-actions/slatify@master
      with:
        type: ${{ job.status }}
        job_name: '*el-get update ${{ env.PACKAGE }}*'
        mention: 'here'
        username: 'GitHub Actions'
        icon_emoji: 'emacs'
        mention_if: 'failure'
        channel: '#emacs-update'
        url: ${{ secrets.SLACK_WEBHOOK }}
        commit: true
        token: ${{ secrets.GITHUB_TOKEN }}
