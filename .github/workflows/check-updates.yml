name: Check updates

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  check-updates:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.set-matrix.outputs.packages }}

    steps:
    - uses: purcell/setup-emacs@master
      with:
        version: 30.2

    - uses: actions/checkout@v7

    - name: Check updates
      run: |
        ./count-emacs-obsolute-packages.sh

    - name: Set matrix
      id: set-matrix
      run: |
        packages=$(jq -R -s -c 'split("\n")[:-1]' /tmp/emacs-outdated-packages.txt)
        echo $packages
        echo "packages=${packages}" >> $GITHUB_OUTPUT

  call-update-workflow:
    needs: check-updates
    strategy:
      fail-fast: false
      matrix:
        package: ${{fromJson(needs.check-updates.outputs.packages)}}
    uses: ./.github/workflows/create-package-update-pr.yml
    with:
      package: ${{ matrix.package }}
    secrets: inherit
